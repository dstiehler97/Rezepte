  <meta name="color-scheme" content="light dark">
  <script>
    /* Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen). Einstellung: Mehr → Darstellung,
       speicher 'darstellung' = "auto" | "hell" | "dunkel". Setzt <html data-theme="light|dark">. */
    (function () {
      var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
      function anwenden() {
        var w = 'auto';
        try { w = JSON.parse(localStorage.getItem('rezepte.darstellung')) || 'auto'; } catch (e) { /* privat-modus */ }
        var dunkel = w === 'dunkel' || (w !== 'hell' && !!(mq && mq.matches));
        var h = document.documentElement;
        h.setAttribute('data-theme', dunkel ? 'dark' : 'light');
        var farbe = dunkel ? '#151311' : '#f6f4f1';   /* = --papier (assets/style.css) */
        var ms = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < ms.length; i++) ms[i].setAttribute('content', farbe);
        var s = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (s) s.setAttribute('content', dunkel ? 'black' : 'default');
      }
      anwenden();
      if (mq) { if (mq.addEventListener) mq.addEventListener('change', anwenden); else if (mq.addListener) mq.addListener(anwenden); }
      window.darstellungAnwenden = anwenden;
    })();
  </script>
