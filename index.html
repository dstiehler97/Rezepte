<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Rezepte</title>
  <meta name="theme-color" content="#a8432a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- "default": dunkle Statusleiste auf hellem Grund, Inhalt beginnt darunter (helles Papier-Design) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-180.png">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen). Einstellung: Mehr → Darstellung,
       speicher 'darstellung' = "auto" | "hell" | "dunkel". Setzt <html data-theme="light|dark">. */
    (function () {
      var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
      function anwenden() {
        var w = 'auto';
        try { w = JSON.parse(localStorage.getItem('rezepte.darstellung')) || 'auto'; } catch (e) { /* privat-modus */ }
        var dunkel = w === 'dunkel' || (w !== 'hell' && !!(mq && mq.matches));
        var h = document.documentElement;
        h.setAttribute('data-theme', dunkel ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dunkel ? '#1c1916' : '#a8432a');
        var s = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (s) s.setAttribute('content', dunkel ? 'black' : 'default');
      }
      anwenden();
      if (mq) { if (mq.addEventListener) mq.addEventListener('change', anwenden); else if (mq.addListener) mq.addListener(anwenden); }
      window.darstellungAnwenden = anwenden;
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
